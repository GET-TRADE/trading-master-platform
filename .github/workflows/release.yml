name: Release APKs

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish signed release APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run all tests
        run: ./gradlew testDebugUnitTest

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/tm-release.jks
          ls -la $RUNNER_TEMP/tm-release.jks

      - name: Build SIGNED release APKs
        run: ./gradlew :app:assembleRelease :admin:assembleRelease :pro:assembleRelease
          -Pandroid.injected.signing.store.file=$RUNNER_TEMP/tm-release.jks
          -Pandroid.injected.signing.store.type=jks
          -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }}
          -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }}
          -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Rename artifacts
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/TradingMaster-${GITHUB_REF_NAME}.apk
          cp admin/build/outputs/apk/release/admin-release.apk release/TradingMasterAdmin-${GITHUB_REF_NAME}.apk
          cp pro/build/outputs/apk/release/pro-release.apk release/TradingMasterPro-${GITHUB_REF_NAME}.apk
          ls -la release/

      - name: Verify APKs are signed
        run: |
          for apk in release/*.apk; do
            python3 -c "import sys; d=open('$apk','rb').read(); sys.exit(0 if b'APK Sig Block 42' in d else 1)"
            if [ $? -eq 0 ]; then echo "SIGNED: $apk"; else echo "ERROR: $apk is NOT signed - refusing to publish"; exit 1; fi
          done

      - name: Upload APKs as workflow artifacts (fallback download path)
        uses: actions/upload-artifact@v4
        with:
          name: signed-apks
          path: release/*.apk

      - name: Create GitHub Release with APKs
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          body: |
            Trading Master platform release ${{ github.ref_name }}

            - TradingMaster: user scanning & paper trading app
            - TradingMasterAdmin: administrator app
            - TradingMasterPro: premium analysis app

            APKs are signed with the Trading Master release key (v2 signing).
            Updates install over previous versions of the same signature.
          files: release/*.apk
